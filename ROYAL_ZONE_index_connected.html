<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ROYAL ZONE Men's Wear</title>
<style>body{margin:0;background:#090909;color:#eee;font-family:Arial}header{text-align:center;padding:24px;border-bottom:1px solid #332a16}h1{color:#d7a928}.wrap{max-width:1100px;margin:auto;padding:18px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px}.card{background:#111;border:1px solid #332a16;border-radius:14px;overflow:hidden}.photos{display:flex;overflow:auto}.photos img{min-width:100%;height:190px;object-fit:cover}.info{padding:12px}.price{color:#d7a928;font-size:20px;font-weight:bold}.btn{display:block;text-align:center;background:#d7a928;color:#000;padding:10px;border-radius:9px;text-decoration:none;margin-top:10px}</style></head><body>
<header><h1>ROYAL ZONE</h1><div>MEN'S WEAR • KANKROLI</div></header><main class="wrap"><h2 style="color:#d7a928">SPORT SHOES COLLECTION</h2><div id="grid">Loading…</div></main>
<script>
const API_URL="https://script.google.com/macros/s/AKfycbyN6-FjeDp1H29akmcK0eaLPfPlA2gcAgck6CAHvn7ctscvsMCIxjRn_duqMyKpOcQg/exec";
const fallback=[{"id": "shoe-1", "name": "Sport Shoe 1", "price": 999, "sizes": "6,7,8,9,10", "photo1": "", "photo2": "", "photo3": "", "available": true}, {"id": "shoe-2", "name": "Sport Shoe 2", "price": 999, "sizes": "6,7,8,9,10", "photo1": "", "photo2": "", "photo3": "", "available": true}, {"id": "shoe-3", "name": "Sport Shoe 3", "price": 999, "sizes": "6,7,8,9,10", "photo1": "", "photo2": "", "photo3": "", "available": true}, {"id": "shoe-4", "name": "Sport Shoe 4", "price": 999, "sizes": "6,7,8,9,10", "photo1": "", "photo2": "", "photo3": "", "available": true}, {"id": "shoe-5", "name": "Sport Shoe 5", "price": 999, "sizes": "6,7,8,9,10", "photo1": "", "photo2": "", "photo3": "", "available": true}, {"id": "shoe-6", "name": "Sport Shoe 6", "price": 999, "sizes": "6,7,8,9,10", "photo1": "", "photo2": "", "photo3": "", "available": true}, {"id": "shoe-7", "name": "Sport Shoe 7", "price": 999, "sizes": "6,7,8,9,10", "photo1": "", "photo2": "", "photo3": "", "available": true}, {"id": "shoe-8", "name": "Sport Shoe 8", "price": 999, "sizes": "6,7,8,9,10", "photo1": "", "photo2": "", "photo3": "", "available": true}, {"id": "shoe-9", "name": "Sport Shoe 9", "price": 999, "sizes": "6,7,8,9,10", "photo1": "", "photo2": "", "photo3": "", "available": true}, {"id": "shoe-10", "name": "Sport Shoe 10", "price": 999, "sizes": "6,7,8,9,10", "photo1": "", "photo2": "", "photo3": "", "available": true}];
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function render(ps){const g=document.getElementById("grid");const a=(ps||[]).filter(p=>p.available!==false);g.className="grid";g.innerHTML=a.map(p=>{let im=[p.photo1,p.photo2,p.photo3].filter(Boolean);let pics=im.length?im.map(x=>`<img src="${esc(x)}">`).join(""):"<div style='height:190px;display:grid;place-items:center'>Photo nahi hai</div>";let m=encodeURIComponent(`ROYAL ZONE enquiry: ${p.name} | ₹${p.price} | Sizes: ${p.sizes}`);return `<article class="card"><div class="photos">${pics}</div><div class="info"><b>${esc(p.name)}</b><div class="price">₹${esc(p.price)}</div><div>Sizes: ${esc(p.sizes)}</div><a class="btn" href="https://wa.me/918875424376?text=${m}">WhatsApp Order</a></div></article>`}).join("")||"No products";}
async function load(){try{if(!API_URL){render(fallback);return}render((await (await fetch(API_URL,{cache:"no-store"})).json()).products)}catch(e){render(fallback)}}load();
</script></body></html>
