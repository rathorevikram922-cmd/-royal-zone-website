<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ROYAL ZONE Admin</title><style>body{font-family:Arial;background:#090909;color:#fff;margin:0}.w{max-width:560px;margin:auto;padding:18px}h1{color:#d7a928}.b{background:#111;border:1px solid #332a16;padding:16px;border-radius:14px;margin:12px 0}input,button{width:100%;padding:13px;margin:6px 0;border-radius:9px;border:1px solid #555;font-size:16px}button{background:#d7a928;font-weight:bold}.del{background:#8b2222;color:#fff}.item{border-top:1px solid #333;padding:12px 0}</style></head><body><div class=w><h1>ROYAL ZONE Admin</h1><div class=b><input id=api placeholder="Google Apps Script Web App URL"><button onclick=setapi()>Save API URL</button></div><div class=b><input id=id type=hidden><input id=name placeholder="Shoe name"><input id=price type=number placeholder="Price ₹"><input id=sizes placeholder="Sizes: 6,7,8,9,10"><input id=photos type=file accept=image/* multiple><button onclick=save()>Save Shoe</button><button onclick=clearf()>Clear</button><p id=msg></p></div><div class=b><h3>Products</h3><div id=list>API URL save karein.</div></div></div><script>
let API=localStorage.getItem("rz_api")||"";api.value=API;function setapi(){API=api.value.trim();localStorage.setItem("rz_api",API);load()}function clearf(){id.value=name.value=price.value=sizes.value="";photos.value=""}function files(){return Promise.all([...photos.files].slice(0,3).map(f=>new Promise((r,j)=>{let x=new FileReader();x.onload=()=>r(x.result);x.onerror=j;x.readAsDataURL(f)})))}async function save(){if(!API){msg.textContent="Pehle API URL save karein";return}msg.textContent="Saving…";let p={id:id.value||undefined,name:name.value,price:price.value,sizes:sizes.value,images:await files()};let d=await (await fetch(API,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({action:"save",product:p})})).json();msg.textContent=d.ok?"Saved!":d.error;clearf();load()}async function load(){if(!API)return;try{let d=await(await fetch(API,{cache:"no-store"})).json();list.innerHTML=(d.products||[]).map(p=>`<div class=item><b>${p.name}</b> — ₹${p.price}<br>Sizes: ${p.sizes}<br><button onclick='edit(${JSON.stringify(p)})'>Edit</button><button class=del onclick='del("${p.id}")'>Delete</button></div>`).join("")||"No products"}catch(e){list.textContent=e}}function edit(p){id.value=p.id;name.value=p.name;price.value=p.price;sizes.value=p.sizes}async function del(x){if(confirm("Delete?")){await fetch(API,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({action:"delete",id:x})});load()}}</script></body></html>
